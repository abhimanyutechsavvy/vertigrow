<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VertiGrow AI Dashboard</title>

  <style>
    :root {
      --bg-main: #0a0f1e;
      --bg-panel: rgba(18, 26, 47, 0.85);
      --bg-card: rgba(11, 19, 43, 0.9);
      --accent: #00f7ff;
      --good: #00ff9c;
      --warn: #ffd000;
      --bad: #ff4d4d;
      --text-main: #e0e6ff;
      --muted: #8b93b8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #101833, #050812 70%);
      color: var(--text-main);
      font-family: "Segoe UI", Inter, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .panel {
      width: 100%;
      max-width: 520px;
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      border-radius: 16px;
      padding: 24px;
      box-shadow:
        0 0 0 1px rgba(0, 247, 255, 0.15),
        0 20px 40px rgba(0, 0, 0, 0.6);
    }

    h1 {
      margin: 0 0 20px;
      text-align: center;
      font-size: 26px;
      color: var(--accent);
      text-shadow: 0 0 12px rgba(0, 247, 255, 0.5);
    }

    .vitals {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.05),
        0 8px 18px rgba(0,0,0,0.5);
    }

    .card div:first-child {
      font-size: 13px;
      color: var(--muted);
    }

    .value {
      margin-top: 6px;
      font-size: 24px;
      font-weight: 700;
    }

    .good { color: var(--good); }
    .warn { color: var(--warn); }
    .bad  { color: var(--bad); }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: var(--bg-card);
      color: #fff;
      margin-bottom: 10px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      color: #002b2e;
      background: linear-gradient(135deg, #00f7ff, #00c8d4);
    }

    .reply {
      margin-top: 14px;
      padding: 14px;
      min-height: 60px;
      background: var(--bg-card);
      border-radius: 12px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="panel">
    <h1>VertiGrow AI</h1>

    <!-- LIVE VITALS -->
    <div class="vitals">
      <div class="card">
        <div>pH</div>
        <div id="phValue" class="value">--</div>
      </div>
      <div class="card">
        <div>TDS</div>
        <div id="tdsValue" class="value">--</div>
      </div>
      <div class="card">
        <div>Health</div>
        <div id="healthValue" class="value">--</div>
      </div>
    </div>

    <!-- AI -->
    <input id="aiInput" placeholder="Ask anything… add nutrients" />
    <button onclick="sendAICommand()">Send</button>

    <div class="reply" id="aiReply">AI response will appear here…</div>

    <button onclick="downloadExcel()">Download Excel Report</button>
  </div>

  <script>
    async function updateVitals() {
      try {
        const res = await fetch("/api/data", { method: "POST" });
        const data = await res.json();

        document.getElementById("phValue").innerText = data.ph ?? "--";
        document.getElementById("tdsValue").innerText = data.tds ?? "--";

        const healthEl = document.getElementById("healthValue");
        healthEl.className = "value";

        if (data.ph >= 5.8 && data.ph <= 6.5 && data.tds >= 800 && data.tds <= 1200) {
          healthEl.innerText = "GOOD";
          healthEl.classList.add("good");
        } else if (
          (data.ph >= 5.5 && data.ph < 5.8) ||
          (data.ph > 6.5 && data.ph <= 6.8)
        ) {
          healthEl.innerText = "MODERATE";
          healthEl.classList.add("warn");
        } else {
          healthEl.innerText = "BAD";
          healthEl.classList.add("bad");
        }
      } catch {
        console.log("Vitals fetch failed");
      }
    }

    async function sendAICommand() {
      const message = document.getElementById("aiInput").value;
      if (!message) return;

      document.getElementById("aiReply").innerText = "Thinking…";

      const res = await fetch("/api/ai", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      });

      const data = await res.json();
      document.getElementById("aiReply").innerText = data.reply || "No response";
    }

    function downloadExcel() {
      window.location.href = "/api/excel";
    }

    updateVitals();
    setInterval(updateVitals, 5000);
  </script>
</body>
</html>
