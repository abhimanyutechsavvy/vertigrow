<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VertiGrow AI</title>

  <style>
    body {
      margin: 0;
      background: #050812;
      color: #e0e6ff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .panel {
      width: 360px;
      background: #0b132b;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 0 30px rgba(0,255,255,0.2);
    }

    h1 {
      text-align: center;
      color: #00f7ff;
    }

    .vitals {
      display: flex;
      justify-content: space-between;
      margin: 15px 0;
    }

    .card {
      width: 30%;
      background: #101833;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
    }

    button {
      background: #00f7ff;
      font-weight: bold;
      cursor: pointer;
    }

    .reply {
      margin-top: 12px;
      min-height: 50px;
      background: #101833;
      padding: 10px;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div class="panel">
    <h1>VertiGrow AI</h1>

    <div class="vitals">
      <div class="card">
        <div>pH</div>
        <div id="phValue">--</div>
      </div>
      <div class="card">
        <div>TDS</div>
        <div id="tdsValue">--</div>
      </div>
      <div class="card">
        <div>Health</div>
        <div id="healthValue">--</div>
      </div>
    </div>

    <input id="aiInput" placeholder="Ask anything…" />
    <button onclick="sendAI()">Send</button>

    <div class="reply" id="aiReply">
      AI response will appear here…
    </div>
  </div>

  <script src="/ai.js"></script>
</body>
</html>
